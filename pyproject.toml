[project]
name = "trade-to-go"
version = "0.1.0"
description = "Evidence-based gold (MYR) and US equity alert pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "exchange-calendars>=4.5",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pandera>=0.24",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "typer>=0.12",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
# Heavy or gateway-dependent extras; install with `uv sync --extra backtest --extra broker`.
backtest = ["vectorbt>=0.26"]
broker = ["moomoo-api"]

[project.scripts]
ttg = "trade_to_go.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_to_go"]

[tool.pytest.ini_options]
testpaths = ["tests"]
